name: 'GitHub LeetCode Bot'

on:
  push:
    paths:
      - "leetcode/**/*.go"  # 代码文件变更触发
      - "build/leetcode.go" # 脚本变更触发
  workflow_dispatch:  # 手动触发

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v4

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"  
          cache-dependency-path: "leetcode-golang/go.sum"
      
      - name: Run script
        run: go run build/leetcode.go

      - name: 提交并推送变更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update leetcode table via go script"
          file_pattern: "README.md"
          branch: ${{ github.ref }}
